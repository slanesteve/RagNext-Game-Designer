<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8E2DE2" />
            <stop offset="100%" stop-color="#4A00E0" />
        </linearGradient>
        <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8E2DE2" flood-opacity="0.5" />
        </filter>
    </defs>
    <!-- Rounded squircle corner box with OneDark violet gradient and glow -->
    <rect x="24" y="24" width="408" height="408" rx="96" ry="96" fill="url(#logoGrad)" filter="url(#glow)" />
    
    <!-- Bold white centered RN text -->
    <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="160" fill="#FFFFFF">RN</text>
</svg>
