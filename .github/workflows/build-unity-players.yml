name: Build Unity Player Templates

on:
  workflow_dispatch: # Manually trigger from GitHub Actions
    inputs:
      buildOSX:
        description: 'Build macOS StandaloneOSX'
        type: boolean
        default: true
      buildLinux:
        description: 'Build Linux StandaloneLinux64'
        type: boolean
        default: true
      buildWebGL:
        description: 'Build WebGL'
        type: boolean
        default: true
      buildWindows:
        description: 'Build Windows StandaloneWindows64'
        type: boolean
        default: true

jobs:
  # Build Linux and WebGL targets on Ubuntu runners using GameCI Docker containers (IL2CPP)
  build-unity-templates-linux:
    name: Build ${{ matrix.targetPlatform }} (Linux Container)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneLinux64
            inputKey: buildLinux
            buildName: 'RagNextPlayer'
            customImage: 'unityci/editor:ubuntu-6000.3.6f1-linux-il2cpp-3'
          - targetPlatform: WebGL
            inputKey: buildWebGL
            buildName: 'RagNextPlayer'
            customImage: 'unityci/editor:ubuntu-6000.3.6f1-webgl-3'
    steps:
      - name: Free Disk Space (Ubuntu)
        if: ${{ inputs[matrix.inputKey] }}
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout Source Code
        if: ${{ inputs[matrix.inputKey] }}
        uses: actions/checkout@v4
        with:
          lfs: true

      # Build using GameCI Action with automated license
      - name: Build Unity Player
        if: ${{ inputs[matrix.inputKey] }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: RagNextPlayer
          unityVersion: 6000.3.6f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ matrix.buildName }}
          customImage: ${{ matrix.customImage }}

      # Upload build output as zip artifacts
      - name: Upload Artifact
        if: ${{ inputs[matrix.inputKey] }}
        uses: actions/upload-artifact@v4
        with:
          name: UnityTemplate-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          if-no-files-found: error

  # Build Windows StandaloneWindows64 IL2CPP target by installing Unity directly on windows-latest host.
  # GameCI always forces Docker on Windows runners and Unity 6 crashes inside Windows containers (exit code 1).
  # Direct host installation bypasses Docker entirely and gives full access to MSVC for IL2CPP.
  build-unity-template-windows:
    name: Build StandaloneWindows64 IL2CPP (Direct Host Install)
    runs-on: windows-latest
    if: ${{ inputs.buildWindows }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Installation
        uses: actions/cache@v4
        id: unity-cache
        with:
          path: C:\Unity
          key: unity-windows-6000.3.6f1-il2cpp-v1

      - name: Download & Install Unity Editor + Windows IL2CPP Module
        if: steps.unity-cache.outputs.cache-hit != 'true'
        run: |
          $changeset = "bbb010bdb8a3"
          $version = "6000.3.6f1"
          $base = "https://download.unity3d.com/download_unity/$changeset"

          Write-Host "=== Downloading Unity Editor ==="
          Invoke-WebRequest "$base/Windows64EditorInstaller/UnitySetup64-$version.exe" -OutFile "$env:TEMP\UnitySetup.exe" -UseBasicParsing
          Write-Host "=== Installing Unity Editor (silent) ==="
          Start-Process "$env:TEMP\UnitySetup.exe" -ArgumentList "/S /D=C:\Unity" -Wait

          Write-Host "=== Downloading Windows IL2CPP Support ==="
          Invoke-WebRequest "$base/TargetSupportInstaller/UnitySetup-Windows-IL2CPP-Support-for-Editor-$version.exe" -OutFile "$env:TEMP\UnityIL2CPP.exe" -UseBasicParsing
          Write-Host "=== Installing Windows IL2CPP Support ==="
          Start-Process "$env:TEMP\UnityIL2CPP.exe" -ArgumentList "/S" -Wait

          Write-Host "=== Verifying installation ==="
          Get-Item "C:\Unity\Editor\Unity.exe" | Select-Object FullName, Length
        shell: pwsh
        timeout-minutes: 60

      - name: Activate Unity License
        run: |
          & "C:\Unity\Editor\Unity.exe" -quit -batchmode -nographics `
            -serial "$env:UNITY_SERIAL" `
            -username "$env:UNITY_EMAIL" `
            -password "$env:UNITY_PASSWORD" `
            -logFile "$env:GITHUB_WORKSPACE\activate.log"
          if (Test-Path "$env:GITHUB_WORKSPACE\activate.log") {
            Get-Content "$env:GITHUB_WORKSPACE\activate.log" | Select-Object -Last 20
          }
        shell: pwsh
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        timeout-minutes: 10

      - name: Build Windows IL2CPP Player
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\build\StandaloneWindows64" | Out-Null
          $outExe = "$env:GITHUB_WORKSPACE\build\StandaloneWindows64\RagNextPlayer.exe"
          $log    = "$env:GITHUB_WORKSPACE\build.log"

          Write-Host "=== Starting Unity IL2CPP build ==="
          & "C:\Unity\Editor\Unity.exe" `
            -quit -batchmode -nographics `
            -projectPath "$env:GITHUB_WORKSPACE\RagNextPlayer" `
            -buildTarget StandaloneWindows64 `
            -buildWindows64Player $outExe `
            -logFile $log

          $code = $LASTEXITCODE
          Write-Host "Unity exited with code: $code"
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 60 }
          exit $code
        shell: pwsh
        timeout-minutes: 90

      - name: Return Unity License
        if: always()
        run: |
          & "C:\Unity\Editor\Unity.exe" -quit -batchmode -nographics -returnlicense `
            -logFile "$env:GITHUB_WORKSPACE\return.log" 2>&1 | Out-Null
        shell: pwsh
        continue-on-error: true

      - name: Upload Build Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-logs-windows
          path: |
            activate.log
            build.log
            return.log
          if-no-files-found: ignore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityTemplate-StandaloneWindows64
          path: build/StandaloneWindows64
          if-no-files-found: error

  # Build macOS StandaloneOSX IL2CPP target natively on macos-latest runner (Xcode)
  build-unity-template-mac:
    name: Build StandaloneOSX (macOS IL2CPP Host)
    runs-on: macos-latest
    if: ${{ inputs.buildOSX }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity macOS IL2CPP Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: RagNextPlayer
          unityVersion: 6000.3.6f1
          targetPlatform: StandaloneOSX
          buildName: RagNextPlayer

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityTemplate-StandaloneOSX
          path: build/StandaloneOSX
          if-no-files-found: error

  commit-templates:
    name: Commit Built Templates to Repository
    needs: [build-unity-templates-linux, build-unity-template-windows, build-unity-template-mac]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Download OSX Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: UnityTemplate-StandaloneOSX
          path: tmp-artifacts/StandaloneOSX

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: UnityTemplate-StandaloneWindows64
          path: tmp-artifacts/StandaloneWindows64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: UnityTemplate-StandaloneLinux64
          path: tmp-artifacts/StandaloneLinux64

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: UnityTemplate-WebGL
          path: tmp-artifacts/WebGL

      - name: Update Templates Directory
        run: |
          # 1. MacOS (Rename and copy)
          if [ -d "tmp-artifacts/StandaloneOSX" ]; then
            APP_PATH=$(find tmp-artifacts/StandaloneOSX -name "*.app" -type d | head -n 1)
            if [ -n "$APP_PATH" ]; then
              echo "Cleaning up MacOS templates..."
              rm -rf Templates/MacOS/*
              echo "Copying macOS app from $APP_PATH to Templates/MacOS/MacOS.app"
              mkdir -p Templates/MacOS
              cp -a "$APP_PATH" Templates/MacOS/MacOS.app
            else
              echo "Warning: macOS app bundle not found."
            fi
          fi

          # 2. Windows
          if [ -d "tmp-artifacts/StandaloneWindows64" ]; then
            EXE_PATH=$(find tmp-artifacts/StandaloneWindows64 -type f \( -name "*.exe" -o -name "RagNextPlayer*" \) | head -n 1)
            if [ -n "$EXE_PATH" ]; then
              echo "Cleaning up Windows templates..."
              rm -rf Templates/Windows/*
              SRC_DIR=$(dirname "$EXE_PATH")
              echo "Copying Windows files from $SRC_DIR to Templates/Windows/ (excluding DoNotShip and D3D12 debug folders)"
              mkdir -p Templates/Windows
              rsync -a \
                --exclude='*BackUpThisFolder_ButDontShipItWithYourGame' \
                --exclude='*BurstDebugInformation_DoNotShip' \
                "$SRC_DIR"/ Templates/Windows/
            else
              echo "Warning: Windows executable not found."
            fi
          fi

          # 3. Linux
          if [ -d "tmp-artifacts/StandaloneLinux64" ]; then
            LINUX_BIN=$(find tmp-artifacts/StandaloneLinux64 -type f -name "RagNextPlayer" | head -n 1)
            if [ -n "$LINUX_BIN" ]; then
              echo "Cleaning up Linux templates..."
              rm -rf Templates/Linux/*
              SRC_DIR=$(dirname "$LINUX_BIN")
              echo "Copying Linux files from $SRC_DIR to Templates/Linux/ (excluding DoNotShip folders)"
              mkdir -p Templates/Linux
              rsync -a \
                --exclude='*BackUpThisFolder_ButDontShipItWithYourGame' \
                --exclude='*BurstDebugInformation_DoNotShip' \
                "$SRC_DIR"/ Templates/Linux/
            else
              echo "Warning: Linux binary not found."
            fi
          fi

          # 4. WebGL
          if [ -d "tmp-artifacts/WebGL" ]; then
            HTML_PATH=$(find tmp-artifacts/WebGL -name "index.html" -type f | head -n 1)
            if [ -n "$HTML_PATH" ]; then
              echo "Cleaning up WebGL templates..."
              rm -rf Templates/WebGL/*
              SRC_DIR=$(dirname "$HTML_PATH")
              echo "Copying WebGL player from $SRC_DIR to Templates/WebGL/RagNextPlayer"
              mkdir -p Templates/WebGL/RagNextPlayer
              cp -a "$SRC_DIR"/* Templates/WebGL/RagNextPlayer/
            else
              echo "Warning: WebGL index.html not found."
            fi
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config lfs.push.verify false
          git add Templates/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: automated update of built player templates"
            git pull --rebase origin master
            git push origin master
          else
            echo "No changes in built templates to commit."
          fi
