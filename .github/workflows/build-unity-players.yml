name: Build Unity Player Templates

on:
  workflow_dispatch: # Manually trigger from GitHub Actions
    inputs:
      buildOSX:
        description: 'Build macOS StandaloneOSX'
        type: boolean
        default: true
      buildLinux:
        description: 'Build Linux StandaloneLinux64'
        type: boolean
        default: true
      buildWebGL:
        description: 'Build WebGL'
        type: boolean
        default: true
      buildWindows:
        description: 'Build Windows StandaloneWindows64'
        type: boolean
        default: true

jobs:
  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneOSX
            inputKey: buildOSX
          - targetPlatform: StandaloneLinux64
            inputKey: buildLinux
          - targetPlatform: WebGL
            inputKey: buildWebGL
          - targetPlatform: StandaloneWindows64
            inputKey: buildWindows
    steps:
      - name: Free Disk Space (Ubuntu)
        if: ${{ inputs[matrix.inputKey] }}
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout Source Code
        if: ${{ inputs[matrix.inputKey] }}
        uses: actions/checkout@v4

      # Cache Library folder to make subsequent runs fast
      - name: Cache Unity Library
        if: ${{ inputs[matrix.inputKey] }}
        uses: actions/cache@v4
        with:
          path: RagNextPlayer/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('RagNextPlayer/Assets/**', 'RagNextPlayer/Packages/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      # Build using GameCI Action with automated Personal license
      - name: Build Unity Player
        if: ${{ inputs[matrix.inputKey] }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: RagNextPlayer
          unityVersion: 6000.3.6f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: RagNextPlayer

      # Upload build output as zip artifacts
      - name: Upload Artifact
        if: ${{ inputs[matrix.inputKey] }}
        uses: actions/upload-artifact@v4
        with:
          name: UnityTemplate-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          if-no-files-found: error
