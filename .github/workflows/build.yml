name: Build RagNext Designer (Windows, macOS & Linux)

# Workflow trigger config
on:
  workflow_dispatch:
    inputs:
      buildWindows:
        description: 'Build Windows x64 Distribution'
        type: boolean
        default: false
      buildMacIntel:
        description: 'Build macOS Intel x64 Distribution'
        type: boolean
        default: true
      buildMacArm64:
        description: 'Build macOS Arm64 Distribution'
        type: boolean
        default: false
      buildLinux:
        description: 'Build Linux x64 Distribution'
        type: boolean
        default: false

jobs:
  build-windows:
    name: Build Windows x64 Distribution
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buildWindows }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Configure NuGet Cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Retarget RagsCore to Net9.0 (Bypass Mobile Workloads)
      run: |
        sed -i 's/<TargetFrameworks>.*<\/TargetFrameworks>/<TargetFramework>net9.0<\/TargetFramework>/' RagsCore/RagsCore.csproj

    - name: Run Designer Unit Tests
      run: dotnet test RagNext.Tests/RagNext.Tests.csproj -c Release

    - name: Build & Publish Standalone Windows x64
      run: |
        # 0. Ensure zip utility is available on Windows runner
        command -v zip >/dev/null 2>&1 || choco install zip -y

        # 1. Temporarily target net9.0 only to bypass mobile Mono restores
        sed -i 's/<TargetFrameworks>.*<\/TargetFrameworks>/<TargetFramework>net9.0<\/TargetFramework>/' RagsCore/RagsCore.csproj
        
        # 2. Run publish in Single-File ReadyToRun format
        rm -rf Publish/Designer-Windows
        dotnet publish RagNext.Designer.Avalonia/RagNext.Designer.Avalonia.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:Version="1.0.0-alpha.6.${{ github.run_number }}" -p:AssemblyVersion="1.0.0.${{ github.run_number }}" -p:FileVersion="1.0.0.${{ github.run_number }}" -o Publish/Designer-Windows
        
        # 3. Deploy WebAssets, Templates and Tools
        mkdir -p Publish/Designer-Windows/WebAssets
        cp -R RagNext.Designer.Avalonia/WebAssets/* Publish/Designer-Windows/WebAssets/
        if [ -d "Templates" ]; then
          mkdir -p Publish/Designer-Windows/Templates
          cp -R Templates/* Publish/Designer-Windows/Templates/
          for tPlatform in MacOS Windows Linux WebGL; do
            if [ -d "Publish/Designer-Windows/Templates/$tPlatform" ]; then
              (cd "Publish/Designer-Windows/Templates/$tPlatform" && zip -q -r "$tPlatform.template" . && find . -mindepth 1 ! -name "$tPlatform.template" -exec rm -rf {} +)
            fi
          done
        fi

        # 4. Bundle rcodesign for cross-platform macOS signing on Windows
        mkdir -p Publish/Designer-Windows/Tools
        wget -q https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-pc-windows-msvc.zip -O rcodesign.zip
        unzip -q rcodesign.zip -d rcodesign_extracted
        cp rcodesign_extracted/*/rcodesign.exe Publish/Designer-Windows/Tools/rcodesign.exe
        rm -rf rcodesign.zip rcodesign_extracted

        # 5. Restore RagsCore back to multi-targeting
        sed -i 's/<TargetFramework>net9.0<\/TargetFramework>/<TargetFrameworks>net9.0;net9.0-android;net9.0-ios;net9.0-maccatalyst;net9.0-windows10.0.19041.0<\/TargetFrameworks>/' RagsCore/RagsCore.csproj

    - name: Compress Windows Distribution
      run: |
        cd Publish/Designer-Windows
        zip -q -r ../RagNext_Designer_Windows_x64.zip .

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RagNext_Designer_Windows_x64
        path: Publish/RagNext_Designer_Windows_x64.zip
        retention-days: 14

  build-mac-arm64:
    name: Build & Sign macOS Arm64 Distribution
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buildMacArm64 }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Configure NuGet Cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Generate macOS .icns App Icon
      run: |
        mkdir -p RagNext.iconset
        sips -z 16 16     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_16x16.png
        sips -z 32 32     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_16x16@2x.png
        sips -z 32 32     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_32x32.png
        sips -z 64 64     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_32x32@2x.png
        sips -z 128 128   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_128x128.png
        sips -z 256 256   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_128x128@2x.png
        sips -z 256 256   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_256x256.png
        sips -z 512 512   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_256x256@2x.png
        sips -z 512 512   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_512x512.png
        sips -z 1024 1024 RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_512x512@2x.png
        iconutil -c icns RagNext.iconset -o RagNext.icns

    - name: Import Apple Developer ID Certificate
      env:
        CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
        CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
      run: |
        if [ -n "$CERT_P12" ]; then
          echo "Importing Developer ID Certificate into macOS Keychain..."
          echo "$CERT_P12" | tr -d ' \r\n' | base64 --decode > cert.p12 2>/dev/null || echo "$CERT_P12" | tr -d ' \r\n' | base64 -d > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f cert.p12
        else
          echo "No APPLE_DEVELOPER_CERT_P12 found, skipping cert import."
        fi

    - name: Build & Publish Standalone macOS Arm64
      run: |
        # 1. Temporarily target net9.0 only to bypass mobile Mono restores
        sed -i '' 's/<TargetFrameworks>.*<\/TargetFrameworks>/<TargetFramework>net9.0<\/TargetFramework>/' RagsCore/RagsCore.csproj
        
        # 2. Run publish in Single-File ReadyToRun format for Arm64
        rm -rf Publish/Designer-Mac-Arm64
        dotnet publish RagNext.Designer.Avalonia/RagNext.Designer.Avalonia.csproj -c Release -r osx-arm64 --self-contained true -p:PublishAot=true -p:Version="1.0.0-alpha.6.${{ github.run_number }}" -p:AssemblyVersion="1.0.0.${{ github.run_number }}" -p:FileVersion="1.0.0.${{ github.run_number }}" -o Publish/Designer-Mac-Arm64
        
        # 3. Deploy WebAssets, Samples, and Templates to publish output
        mkdir -p Publish/Designer-Mac-Arm64/WebAssets
        cp -R RagNext.Designer.Avalonia/WebAssets/* Publish/Designer-Mac-Arm64/WebAssets/
        if [ -d "Samples" ]; then
          mkdir -p Publish/Designer-Mac-Arm64/Samples
          cp -R Samples/* Publish/Designer-Mac-Arm64/Samples/
        fi
        if [ -d "Templates" ]; then
          mkdir -p Publish/Designer-Mac-Arm64/Templates
          cp -R Templates/* Publish/Designer-Mac-Arm64/Templates/
        fi

        # 4. Create macOS .app Bundle Structure for Arm64
        mkdir -p Publish/RagNext_Arm64.app/Contents/MacOS
        mkdir -p Publish/RagNext_Arm64.app/Contents/Resources
        
        # 5. Move all published contents (including dylibs) into Contents/MacOS
        cp -R Publish/Designer-Mac-Arm64/* Publish/RagNext_Arm64.app/Contents/MacOS/
        
        # Move non-binary resource directories (Samples, WebAssets, Templates, Presets) to Contents/Resources for Apple bundle compliance
        for resDir in Samples WebAssets Templates Presets; do
          if [ -d "Publish/RagNext_Arm64.app/Contents/MacOS/$resDir" ]; then
            rm -rf "Publish/RagNext_Arm64.app/Contents/Resources/$resDir"
            mv "Publish/RagNext_Arm64.app/Contents/MacOS/$resDir" "Publish/RagNext_Arm64.app/Contents/Resources/$resDir"
          fi
        done

        if [ -d "Publish/RagNext_Arm64.app/Contents/Resources/Templates" ]; then
          for tPlatform in MacOS Windows Linux WebGL; do
            if [ -d "Publish/RagNext_Arm64.app/Contents/Resources/Templates/$tPlatform" ]; then
              if [ "$tPlatform" = "MacOS" ] && [ -d "Publish/RagNext_Arm64.app/Contents/Resources/Templates/MacOS/MacOS.app" ]; then
                ditto -c -k --keepParent Publish/RagNext_Arm64.app/Contents/Resources/Templates/MacOS/MacOS.app Publish/RagNext_Arm64.app/Contents/Resources/Templates/MacOS/MacOS.template
                rm -rf Publish/RagNext_Arm64.app/Contents/Resources/Templates/MacOS/MacOS.app
              elif [ "$tPlatform" != "MacOS" ]; then
                (cd "Publish/RagNext_Arm64.app/Contents/Resources/Templates/$tPlatform" && ditto -c -k . "$tPlatform.template" && find . -mindepth 1 ! -name "$tPlatform.template" -exec rm -rf {} +)
              fi
            fi
          done
        fi
        cp RagNext.icns Publish/RagNext_Arm64.app/Contents/Resources/

        # Ensure core executable has +x execution rights
        chmod +x Publish/RagNext_Arm64.app/Contents/MacOS/RagNext
        # Clean up build artifacts that can trigger macOS bundle layout validation errors
        rm -rf Publish/RagNext_Arm64.app/Contents/MacOS/Tools
        rm -f Publish/RagNext_Arm64.app/Contents/MacOS/*.exe
        rm -rf Publish/RagNext_Arm64.app/Contents/MacOS/*.dSYM
        rm -f Publish/RagNext_Arm64.app/Contents/MacOS/*.pdb

        # 5. Write standard Apple Info.plist metadata
        echo '<?xml version="1.0" encoding="UTF-8"?>' > Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '<plist version="1.0">' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '<dict>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleDevelopmentRegion</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>English</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleExecutable</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>RagNext</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleIdentifier</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>com.slanesteve.ragnext</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleInfoDictionaryVersion</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>6.0</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleName</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>RagNext</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundlePackageType</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>APPL</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleShortVersionString</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>1.0.0-alpha.6.${{ github.run_number }}</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleSignature</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>????</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleVersion</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>1.0.0.${{ github.run_number }}</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>LSMinimumSystemVersion</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>10.13</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>NSHighResolutionCapable</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <true/>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleIconFile</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>RagNext.icns</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '</dict>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '</plist>' >> Publish/RagNext_Arm64.app/Contents/Info.plist

        # 6. Sign & Notarize Arm64 App Bundle
        if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
          echo "Signing Arm64 App Bundle..."
          KEYCHAIN_ID=$(security find-identity -v -p codesigning build.keychain 2>/dev/null | grep "Developer ID Application" | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$KEYCHAIN_ID" ]; then
            KEYCHAIN_ID="${{ secrets.APPLE_TEAM_ID }}"
          fi
          echo "Using signing identity: $KEYCHAIN_ID"

          find Publish/RagNext_Arm64.app/Contents/MacOS -type f \( -name "*.dylib" -o -name "*.so" -o -name "RagNext" \) -exec codesign --force --verify --verbose --sign "$KEYCHAIN_ID" --options runtime {} +
          codesign --force --verify --verbose --sign "$KEYCHAIN_ID" --options runtime Publish/RagNext_Arm64.app
          
          if [ -n "${{ secrets.APPLE_APP_PASSWORD }}" ]; then
            echo "Submitting Arm64 App for Apple Notarization..."
            (cd Publish && ditto -c -k --keepParent RagNext_Arm64.app RagNext_Arm64.zip)
            SUBMISSION_OUT=$(xcrun notarytool submit Publish/RagNext_Arm64.zip --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" 2>&1 || true)
            echo "$SUBMISSION_OUT"
            SUBMISSION_ID=$(echo "$SUBMISSION_OUT" | grep "id:" | head -n 1 | awk '{print $2}')
            
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Polling Apple Notarization status for submission $SUBMISSION_ID..."
              NOTARIZED=false
              for i in {1..120}; do
                STATUS_OUT=$(xcrun notarytool info "$SUBMISSION_ID" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" 2>&1 || true)
                STATUS_LINE=$(echo "$STATUS_OUT" | grep "status:" | head -n 1 | xargs)
                echo "Check $i ($i/120): $STATUS_LINE"
                
                if echo "$STATUS_LINE" | grep -q "Accepted"; then
                  echo "✅ Apple Notarization Accepted!"
                  NOTARIZED=true
                  sleep 5
                  break
                elif echo "$STATUS_LINE" | grep -q "Invalid"; then
                  echo "❌ Apple Notarization Rejected!"
                  xcrun notarytool log "$SUBMISSION_ID" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" || true
                  exit 1
                fi
                sleep 10
              done

              if [ "$NOTARIZED" = "true" ]; then
                echo "Stapling Apple Notarization ticket to ARM64 App..."
                xcrun stapler staple Publish/RagNext_Arm64.app || true
              else
                echo "❌ Apple Notarization timed out before completion!"
                exit 1
              fi
            fi

            rm -f Publish/RagNext_Arm64.zip
          fi
        fi

        # 7. Restore RagsCore back to multi-targeting
        sed -i '' 's/<TargetFramework>net9.0<\/TargetFramework>/<TargetFrameworks>net9.0;net9.0-android;net9.0-ios;net9.0-maccatalyst;net9.0-windows10.0.19041.0<\/TargetFrameworks>/' RagsCore/RagsCore.csproj

    - name: Compress macOS Arm64 Distribution
      run: |
        cd Publish
        mv RagNext_Arm64.app RagNext.app
        ditto -c -k --keepParent RagNext.app RagNext_Designer_Mac_Arm64.zip
        rm -rf RagNext.app

    - name: Upload macOS Arm64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RagNext_Designer_Mac_Arm64
        path: Publish/RagNext_Designer_Mac_Arm64.zip
        retention-days: 14

  build-mac-intel:
    name: Build & Sign macOS Intel x64 Distribution
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buildMacIntel }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Configure NuGet Cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Generate macOS .icns App Icon
      run: |
        mkdir -p RagNext.iconset
        sips -z 16 16     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_16x16.png
        sips -z 32 32     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_16x16@2x.png
        sips -z 32 32     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_32x32.png
        sips -z 64 64     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_32x32@2x.png
        sips -z 128 128   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_128x128.png
        sips -z 256 256   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_128x128@2x.png
        sips -z 256 256   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_256x256.png
        sips -z 512 512   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_256x256@2x.png
        sips -z 512 512   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_512x512.png
        sips -z 1024 1024 RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_512x512@2x.png
        iconutil -c icns RagNext.iconset -o RagNext.icns

    - name: Import Apple Developer ID Certificate
      env:
        CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
        CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
      run: |
        if [ -n "$CERT_P12" ]; then
          echo "Importing Developer ID Certificate into macOS Keychain..."
          echo "$CERT_P12" | tr -d ' \r\n' | base64 --decode > cert.p12 2>/dev/null || echo "$CERT_P12" | tr -d ' \r\n' | base64 -d > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f cert.p12
        else
          echo "No APPLE_DEVELOPER_CERT_P12 found, skipping cert import."
        fi

    - name: Build & Publish Standalone macOS Intel x64
      run: |
        # 1. Temporarily target net9.0 only to bypass mobile Mono restores
        sed -i '' 's/<TargetFrameworks>.*<\/TargetFrameworks>/<TargetFramework>net9.0<\/TargetFramework>/' RagsCore/RagsCore.csproj
        
        # 2. Run publish in Single-File ReadyToRun format for Intel x64
        rm -rf Publish/Designer-Mac-Intel
        dotnet publish RagNext.Designer.Avalonia/RagNext.Designer.Avalonia.csproj -c Release -r osx-x64 --self-contained true -p:PublishAot=true -p:Version="1.0.0-alpha.6.${{ github.run_number }}" -p:AssemblyVersion="1.0.0.${{ github.run_number }}" -p:FileVersion="1.0.0.${{ github.run_number }}" -o Publish/Designer-Mac-Intel
        
        # 3. Deploy WebAssets, Samples, and Templates to publish output
        mkdir -p Publish/Designer-Mac-Intel/WebAssets
        cp -R RagNext.Designer.Avalonia/WebAssets/* Publish/Designer-Mac-Intel/WebAssets/
        if [ -d "Samples" ]; then
          mkdir -p Publish/Designer-Mac-Intel/Samples
          cp -R Samples/* Publish/Designer-Mac-Intel/Samples/
        fi
        if [ -d "Templates" ]; then
          mkdir -p Publish/Designer-Mac-Intel/Templates
          cp -R Templates/* Publish/Designer-Mac-Intel/Templates/
        fi

        # 4. Create macOS .app Bundle Structure for Intel x64
        mkdir -p Publish/RagNext_Intel.app/Contents/MacOS
        mkdir -p Publish/RagNext_Intel.app/Contents/Resources
        
        # 5. Move all published contents (including dylibs) into Contents/MacOS
        cp -R Publish/Designer-Mac-Intel/* Publish/RagNext_Intel.app/Contents/MacOS/
        
        # Move non-binary resource directories (Samples, WebAssets, Templates, Presets) to Contents/Resources for Apple bundle compliance
        for resDir in Samples WebAssets Templates Presets; do
          if [ -d "Publish/RagNext_Intel.app/Contents/MacOS/$resDir" ]; then
            rm -rf "Publish/RagNext_Intel.app/Contents/Resources/$resDir"
            mv "Publish/RagNext_Intel.app/Contents/MacOS/$resDir" "Publish/RagNext_Intel.app/Contents/Resources/$resDir"
          fi
        done

        if [ -d "Publish/RagNext_Intel.app/Contents/Resources/Templates" ]; then
          for tPlatform in MacOS Windows Linux WebGL; do
            if [ -d "Publish/RagNext_Intel.app/Contents/Resources/Templates/$tPlatform" ]; then
              if [ "$tPlatform" = "MacOS" ] && [ -d "Publish/RagNext_Intel.app/Contents/Resources/Templates/MacOS/MacOS.app" ]; then
                ditto -c -k --keepParent Publish/RagNext_Intel.app/Contents/Resources/Templates/MacOS/MacOS.app Publish/RagNext_Intel.app/Contents/Resources/Templates/MacOS/MacOS.template
                rm -rf Publish/RagNext_Intel.app/Contents/Resources/Templates/MacOS/MacOS.app
              elif [ "$tPlatform" != "MacOS" ]; then
                (cd "Publish/RagNext_Intel.app/Contents/Resources/Templates/$tPlatform" && ditto -c -k . "$tPlatform.template" && find . -mindepth 1 ! -name "$tPlatform.template" -exec rm -rf {} +)
              fi
            fi
          done
        fi
        cp RagNext.icns Publish/RagNext_Intel.app/Contents/Resources/

        # Ensure core executable has +x execution rights
        chmod +x Publish/RagNext_Intel.app/Contents/MacOS/RagNext
        # Clean up build artifacts that can trigger macOS bundle layout validation errors
        rm -rf Publish/RagNext_Intel.app/Contents/MacOS/Tools
        rm -f Publish/RagNext_Intel.app/Contents/MacOS/*.exe
        rm -rf Publish/RagNext_Intel.app/Contents/MacOS/*.dSYM
        rm -f Publish/RagNext_Intel.app/Contents/MacOS/*.pdb

        # 5. Write standard Apple Info.plist metadata
        echo '<?xml version="1.0" encoding="UTF-8"?>' > Publish/RagNext_Intel.app/Contents/Info.plist
        echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '<plist version="1.0">' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '<dict>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleDevelopmentRegion</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>English</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleExecutable</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>RagNext</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleIdentifier</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>com.slanesteve.ragnext</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleInfoDictionaryVersion</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>6.0</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleName</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>RagNext</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundlePackageType</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>APPL</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleShortVersionString</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>1.0.0-alpha.6.${{ github.run_number }}</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleSignature</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>????</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleVersion</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>1.0.0.${{ github.run_number }}</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>LSMinimumSystemVersion</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>10.13</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>NSHighResolutionCapable</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <true/>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleIconFile</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>RagNext.icns</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '</dict>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '</plist>' >> Publish/RagNext_Intel.app/Contents/Info.plist

        # 6. Sign & Notarize Intel x64 App Bundle
        if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
          echo "Signing Intel x64 App Bundle..."
          KEYCHAIN_ID=$(security find-identity -v -p codesigning build.keychain 2>/dev/null | grep "Developer ID Application" | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$KEYCHAIN_ID" ]; then
            KEYCHAIN_ID="${{ secrets.APPLE_TEAM_ID }}"
          fi
          echo "Using signing identity: $KEYCHAIN_ID"

          find Publish/RagNext_Intel.app/Contents/MacOS -type f \( -name "*.dylib" -o -name "*.so" -o -name "RagNext" \) -exec codesign --force --verify --verbose --sign "$KEYCHAIN_ID" --options runtime {} +
          codesign --force --verify --verbose --sign "$KEYCHAIN_ID" --options runtime Publish/RagNext_Intel.app
          
          if [ -n "${{ secrets.APPLE_APP_PASSWORD }}" ]; then
            echo "Submitting Intel x64 App for Apple Notarization..."
            (cd Publish && ditto -c -k --keepParent RagNext_Intel.app RagNext_Intel.zip)
            SUBMISSION_OUT=$(xcrun notarytool submit Publish/RagNext_Intel.zip --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" 2>&1 || true)
            echo "$SUBMISSION_OUT"
            SUBMISSION_ID=$(echo "$SUBMISSION_OUT" | grep "id:" | head -n 1 | awk '{print $2}')
            
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Polling Apple Notarization status for submission $SUBMISSION_ID..."
              NOTARIZED=false
              for i in {1..120}; do
                STATUS_OUT=$(xcrun notarytool info "$SUBMISSION_ID" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" 2>&1 || true)
                STATUS_LINE=$(echo "$STATUS_OUT" | grep "status:" | head -n 1 | xargs)
                echo "Check $i ($i/120): $STATUS_LINE"
                
                if echo "$STATUS_LINE" | grep -q "Accepted"; then
                  echo "✅ Apple Notarization Accepted!"
                  NOTARIZED=true
                  sleep 5
                  break
                elif echo "$STATUS_LINE" | grep -q "Invalid"; then
                  echo "❌ Apple Notarization Rejected!"
                  xcrun notarytool log "$SUBMISSION_ID" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" || true
                  exit 1
                fi
                sleep 10
              done

              if [ "$NOTARIZED" = "true" ]; then
                echo "Stapling Apple Notarization ticket to Intel x64 App..."
                xcrun stapler staple Publish/RagNext_Intel.app || true
              else
                echo "❌ Apple Notarization timed out before completion!"
                exit 1
              fi
            fi

            rm -f Publish/RagNext_Intel.zip
          fi
        fi

        # 7. Restore RagsCore back to multi-targeting
        sed -i '' 's/<TargetFramework>net9.0<\/TargetFramework>/<TargetFrameworks>net9.0;net9.0-android;net9.0-ios;net9.0-maccatalyst;net9.0-windows10.0.19041.0<\/TargetFrameworks>/' RagsCore/RagsCore.csproj

    - name: Compress macOS Intel x64 Distribution
      run: |
        cd Publish
        mv RagNext_Intel.app RagNext.app
        ditto -c -k --keepParent RagNext.app RagNext_Designer_Mac_Intel_x64.zip
        rm -rf RagNext.app

    - name: Upload macOS Intel x64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RagNext_Designer_Mac_Intel_x64
        path: Publish/RagNext_Designer_Mac_Intel_x64.zip
        retention-days: 14

  build-linux:
    name: Build Linux x64 Distribution
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buildLinux }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Configure NuGet Cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Retarget RagsCore to Net9.0 (Bypass Mobile Workloads)
      run: |
        sed -i 's/<TargetFrameworks>.*<\/TargetFrameworks>/<TargetFramework>net9.0<\/TargetFramework>/' RagsCore/RagsCore.csproj

    - name: Install Native AOT Prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev

    - name: Run Designer Unit Tests
      run: dotnet test RagNext.Tests/RagNext.Tests.csproj -c Release

    - name: Build & Publish Standalone Linux x64
      run: |
        # 1. Ensure RagsCore is targeted to net9.0 only
        sed -i 's/<TargetFrameworks>.*<\/TargetFrameworks>/<TargetFramework>net9.0<\/TargetFramework>/' RagsCore/RagsCore.csproj
        
        # 2. Run publish in Single-File ReadyToRun format
        rm -rf Publish/Designer-Linux
        dotnet publish RagNext.Designer.Avalonia/RagNext.Designer.Avalonia.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:Version="1.0.0-alpha.6.${{ github.run_number }}" -p:AssemblyVersion="1.0.0.${{ github.run_number }}" -p:FileVersion="1.0.0.${{ github.run_number }}" -o Publish/Designer-Linux
        
        # 3. Deploy WebAssets and Templates
        mkdir -p Publish/Designer-Linux/WebAssets
        cp -R RagNext.Designer.Avalonia/WebAssets/* Publish/Designer-Linux/WebAssets/
        if [ -d "Templates" ]; then
          mkdir -p Publish/Designer-Linux/Templates
          cp -R Templates/* Publish/Designer-Linux/Templates/
          for tPlatform in MacOS Windows Linux WebGL; do
            if [ -d "Publish/Designer-Linux/Templates/$tPlatform" ]; then
              (cd "Publish/Designer-Linux/Templates/$tPlatform" && zip -q -r "$tPlatform.template" . && find . -mindepth 1 ! -name "$tPlatform.template" -exec rm -rf {} +)
            fi
          done
        fi

        # Ensure core executable has +x execution rights
        chmod +x Publish/Designer-Linux/RagNext

        # 4. Restore RagsCore back to multi-targeting
        sed -i 's/<TargetFramework>net9.0<\/TargetFramework>/<TargetFrameworks>net9.0;net9.0-android;net9.0-ios;net9.0-maccatalyst;net9.0-windows10.0.19041.0<\/TargetFrameworks>/' RagsCore/RagsCore.csproj

    - name: Compress Linux Distribution
      run: |
        cd Publish/Designer-Linux
        tar -czf ../RagNext_Designer_Linux_x64.tar.gz .

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RagNext_Designer_Linux_x64
        path: Publish/RagNext_Designer_Linux_x64.tar.gz
        retention-days: 14
