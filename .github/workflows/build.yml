name: Build RagNext Designer (Windows, macOS & Linux)

# Workflow trigger config
on:
  workflow_dispatch:
    inputs:
      buildWindows:
        description: 'Build Windows Distribution'
        type: boolean
        default: true
      buildMac:
        description: 'Build macOS Distribution'
        type: boolean
        default: true
      buildLinux:
        description: 'Build Linux Distribution'
        type: boolean
        default: true


jobs:
  build-windows:
    name: Build Windows x64 Distribution
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buildWindows }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Configure NuGet Cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Retarget RagsCore to Net9.0 (Bypass Mobile Workloads)
      shell: pwsh
      run: |
        (Get-Content RagsCore\RagsCore.csproj) -replace '<TargetFrameworks>.*</TargetFrameworks>', '<TargetFramework>net9.0</TargetFramework>' | Set-Content RagsCore\RagsCore.csproj

    - name: Run Designer Unit Tests
      run: dotnet test RagNext.Tests/RagNext.Tests.csproj -c Release

    - name: Build & Publish Standalone Windows x64
      shell: pwsh
      run: |
        # 1. Temporarily target net9.0 only to bypass mobile Mono restores
        (Get-Content RagsCore\RagsCore.csproj) -replace '<TargetFrameworks>.*</TargetFrameworks>', '<TargetFramework>net9.0</TargetFramework>' | Set-Content RagsCore\RagsCore.csproj
        
        # 2. Run publish in Single-File ReadyToRun format
        Remove-Item -Recurse -Force Publish\Designer-Windows -ErrorAction SilentlyContinue
        dotnet publish RagNext.Designer.Avalonia/RagNext.Designer.Avalonia.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:Version="1.0.0-alpha.5.${{ github.run_number }}" -p:AssemblyVersion="1.0.0.${{ github.run_number }}" -p:FileVersion="1.0.0.${{ github.run_number }}" -o Publish/Designer-Windows
        
        # 3. Deploy WebAssets and Templates
        New-Item -ItemType Directory -Force Publish\Designer-Windows\WebAssets
        Copy-Item -Recurse -Force RagNext.Designer.Avalonia\WebAssets\* Publish\Designer-Windows\WebAssets\
        if (Test-Path Templates) {
          New-Item -ItemType Directory -Force Publish\Designer-Windows\Templates
          Copy-Item -Recurse -Force Templates\* Publish\Designer-Windows\Templates\
        }

        # 4. Restore RagsCore back to multi-targeting
        (Get-Content RagsCore\RagsCore.csproj) -replace '<TargetFramework>net9.0</TargetFramework>', '<TargetFrameworks>net9.0;net9.0-android;net9.0-ios;net9.0-maccatalyst;net9.0-windows10.0.19041.0</TargetFrameworks>' | Set-Content RagsCore\RagsCore.csproj

    - name: Compress Windows Distribution
      shell: pwsh
      run: |
        Compress-Archive -Path Publish\Designer-Windows\* -DestinationPath Publish\RagNext_Designer_Windows_x64.zip -Force

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RagNext_Designer_Windows_x64
        path: Publish/RagNext_Designer_Windows_x64.zip
        retention-days: 14

  build-mac-arm64:
    name: Build & Sign macOS Arm64 Distribution
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buildMac }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Configure NuGet Cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Generate macOS .icns App Icon
      run: |
        mkdir -p RagNext.iconset
        sips -z 16 16     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_16x16.png
        sips -z 32 32     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_16x16@2x.png
        sips -z 32 32     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_32x32.png
        sips -z 64 64     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_32x32@2x.png
        sips -z 128 128   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_128x128.png
        sips -z 256 256   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_128x128@2x.png
        sips -z 256 256   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_256x256.png
        sips -z 512 512   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_256x256@2x.png
        sips -z 512 512   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_512x512.png
        sips -z 1024 1024 RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_512x512@2x.png
        iconutil -c icns RagNext.iconset -o RagNext.icns

    - name: Import Apple Developer ID Certificate
      env:
        CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
        CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
      run: |
        if [ -n "$CERT_P12" ]; then
          echo "Importing Developer ID Certificate into macOS Keychain..."
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm cert.p12
        else
          echo "No APPLE_DEVELOPER_CERT_P12 found, skipping cert import."
        fi

    - name: Build & Publish Standalone macOS Arm64
      run: |
        # 1. Temporarily target net9.0 only to bypass mobile Mono restores
        sed -i '' 's/<TargetFrameworks>.*<\/TargetFrameworks>/<TargetFramework>net9.0<\/TargetFramework>/' RagsCore/RagsCore.csproj
        
        # 2. Run publish in Single-File ReadyToRun format for Arm64
        rm -rf Publish/Designer-Mac-Arm64
        dotnet publish RagNext.Designer.Avalonia/RagNext.Designer.Avalonia.csproj -c Release -r osx-arm64 --self-contained true -p:PublishAot=true -p:Version="1.0.0-alpha.5.${{ github.run_number }}" -p:AssemblyVersion="1.0.0.${{ github.run_number }}" -p:FileVersion="1.0.0.${{ github.run_number }}" -o Publish/Designer-Mac-Arm64
        
        # 3. Create macOS .app Bundle Structure for Arm64
        mkdir -p Publish/RagNext_Arm64.app/Contents/MacOS
        mkdir -p Publish/RagNext_Arm64.app/Contents/Resources
        
        # 4. Move all published contents (including dylibs) into Contents/MacOS
        cp -R Publish/Designer-Mac-Arm64/* Publish/RagNext_Arm64.app/Contents/MacOS/
        cp -R RagNext.Designer.Avalonia/WebAssets Publish/RagNext_Arm64.app/Contents/MacOS/WebAssets
        if [ -d "Templates" ]; then
          mkdir -p Publish/RagNext_Arm64.app/Contents/Resources/Templates/MacOS
          cp -R Templates/* Publish/RagNext_Arm64.app/Contents/Resources/Templates/
          if [ -d "Templates/MacOS/MacOS.app" ]; then
            codesign --remove-signature Templates/MacOS/MacOS.app 2>/dev/null || true
            ditto -c -k --keepParent Templates/MacOS/MacOS.app Publish/RagNext_Arm64.app/Contents/Resources/Templates/MacOS/MacOS.zip
            rm -rf Publish/RagNext_Arm64.app/Contents/Resources/Templates/MacOS/MacOS.app
          fi
        fi
        cp RagNext.icns Publish/RagNext_Arm64.app/Contents/Resources/

        # Ensure core executable has +x execution rights
        chmod +x Publish/RagNext_Arm64.app/Contents/MacOS/RagNext
        # Clean up build artifacts that can trigger macOS bundle layout validation errors
        rm -rf Publish/RagNext_Arm64.app/Contents/MacOS/*.dSYM
        rm -f Publish/RagNext_Arm64.app/Contents/MacOS/*.pdb

        # 5. Write standard Apple Info.plist metadata
        echo '<?xml version="1.0" encoding="UTF-8"?>' > Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '<plist version="1.0">' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '<dict>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleDevelopmentRegion</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>English</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleExecutable</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>RagNext</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleIdentifier</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>com.slanesteve.ragnext</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleInfoDictionaryVersion</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>6.0</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleName</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>RagNext</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundlePackageType</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>APPL</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleShortVersionString</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>1.0.0-alpha.5.${{ github.run_number }}</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleSignature</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>????</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleVersion</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>1.0.0.${{ github.run_number }}</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>LSMinimumSystemVersion</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>10.13</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>NSHighResolutionCapable</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <true/>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <key>CFBundleIconFile</key>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '    <string>RagNext.icns</string>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '</dict>' >> Publish/RagNext_Arm64.app/Contents/Info.plist
        echo '</plist>' >> Publish/RagNext_Arm64.app/Contents/Info.plist

        # 6. Sign & Notarize Arm64 App Bundle
        if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
          echo "Signing Arm64 App Bundle..."
          find Publish/RagNext_Arm64.app/Contents/MacOS -type f \( -name "*.dylib" -o -name "*.so" -o -name "RagNext" \) -exec codesign --force --verify --verbose --sign "Developer ID Application: RagNext Labs LLC (${{ secrets.APPLE_TEAM_ID }})" --options runtime {} +
          codesign --force --verify --verbose --sign "Developer ID Application: RagNext Labs LLC (${{ secrets.APPLE_TEAM_ID }})" --options runtime Publish/RagNext_Arm64.app
          
          if [ -n "${{ secrets.APPLE_APP_PASSWORD }}" ]; then
            echo "Submitting Arm64 App for Apple Notarization..."
            ditto -c -k --keepParent Publish/RagNext_Arm64.app Publish/RagNext_Arm64.zip
            xcrun notarytool submit Publish/RagNext_Arm64.zip --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --wait
            xcrun stapler staple Publish/RagNext_Arm64.app
            rm -f Publish/RagNext_Arm64.zip
          fi
        fi

        # 7. Restore RagsCore back to multi-targeting
        sed -i '' 's/<TargetFramework>net9.0<\/TargetFramework>/<TargetFrameworks>net9.0;net9.0-android;net9.0-ios;net9.0-maccatalyst;net9.0-windows10.0.19041.0<\/TargetFrameworks>/' RagsCore/RagsCore.csproj

    - name: Compress macOS Arm64 Distribution
      run: |
        cd Publish
        mv RagNext_Arm64.app RagNext.app
        zip -r RagNext_Designer_Mac_Arm64.zip RagNext.app
        rm -rf RagNext.app

    - name: Upload macOS Arm64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RagNext_Designer_Mac_Arm64
        path: Publish/RagNext_Designer_Mac_Arm64.zip
        retention-days: 14

  build-mac-intel:
    name: Build & Sign macOS Intel x64 Distribution
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buildMac }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Configure NuGet Cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Generate macOS .icns App Icon
      run: |
        mkdir -p RagNext.iconset
        sips -z 16 16     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_16x16.png
        sips -z 32 32     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_16x16@2x.png
        sips -z 32 32     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_32x32.png
        sips -z 64 64     RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_32x32@2x.png
        sips -z 128 128   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_128x128.png
        sips -z 256 256   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_128x128@2x.png
        sips -z 256 256   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_256x256.png
        sips -z 512 512   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_256x256@2x.png
        sips -z 512 512   RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_512x512.png
        sips -z 1024 1024 RagNext.Designer.Avalonia/Assets/ragnext-logo.png --out RagNext.iconset/icon_512x512@2x.png
        iconutil -c icns RagNext.iconset -o RagNext.icns

    - name: Import Apple Developer ID Certificate
      env:
        CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
        CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
      run: |
        if [ -n "$CERT_P12" ]; then
          echo "Importing Developer ID Certificate into macOS Keychain..."
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm cert.p12
        else
          echo "No APPLE_DEVELOPER_CERT_P12 found, skipping cert import."
        fi

    - name: Build & Publish Standalone macOS Intel x64
      run: |
        # 1. Temporarily target net9.0 only to bypass mobile Mono restores
        sed -i '' 's/<TargetFrameworks>.*<\/TargetFrameworks>/<TargetFramework>net9.0<\/TargetFramework>/' RagsCore/RagsCore.csproj
        
        # 2. Run publish in Single-File ReadyToRun format for Intel x64
        rm -rf Publish/Designer-Mac-Intel
        dotnet publish RagNext.Designer.Avalonia/RagNext.Designer.Avalonia.csproj -c Release -r osx-x64 --self-contained true -p:PublishAot=true -p:Version="1.0.0-alpha.5.${{ github.run_number }}" -p:AssemblyVersion="1.0.0.${{ github.run_number }}" -p:FileVersion="1.0.0.${{ github.run_number }}" -o Publish/Designer-Mac-Intel
        
        # 3. Create macOS .app Bundle Structure for Intel x64
        mkdir -p Publish/RagNext_Intel.app/Contents/MacOS
        mkdir -p Publish/RagNext_Intel.app/Contents/Resources
        
        # 4. Move all published contents (including dylibs) into Contents/MacOS
        cp -R Publish/Designer-Mac-Intel/* Publish/RagNext_Intel.app/Contents/MacOS/
        cp -R RagNext.Designer.Avalonia/WebAssets Publish/RagNext_Intel.app/Contents/MacOS/WebAssets
        if [ -d "Templates" ]; then
          mkdir -p Publish/RagNext_Intel.app/Contents/Resources/Templates/MacOS
          cp -R Templates/* Publish/RagNext_Intel.app/Contents/Resources/Templates/
          if [ -d "Templates/MacOS/MacOS.app" ]; then
            codesign --remove-signature Templates/MacOS/MacOS.app 2>/dev/null || true
            ditto -c -k --keepParent Templates/MacOS/MacOS.app Publish/RagNext_Intel.app/Contents/Resources/Templates/MacOS/MacOS.zip
            rm -rf Publish/RagNext_Intel.app/Contents/Resources/Templates/MacOS/MacOS.app
          fi
        fi
        cp RagNext.icns Publish/RagNext_Intel.app/Contents/Resources/

        # Ensure core executable has +x execution rights
        chmod +x Publish/RagNext_Intel.app/Contents/MacOS/RagNext
        # Clean up build artifacts that can trigger macOS bundle layout validation errors
        rm -rf Publish/RagNext_Intel.app/Contents/MacOS/*.dSYM
        rm -f Publish/RagNext_Intel.app/Contents/MacOS/*.pdb

        # 5. Write standard Apple Info.plist metadata
        echo '<?xml version="1.0" encoding="UTF-8"?>' > Publish/RagNext_Intel.app/Contents/Info.plist
        echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '<plist version="1.0">' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '<dict>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleDevelopmentRegion</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>English</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleExecutable</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>RagNext</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleIdentifier</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>com.slanesteve.ragnext</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleInfoDictionaryVersion</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>6.0</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleName</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>RagNext</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundlePackageType</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>APPL</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleShortVersionString</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>1.0.0-alpha.5.${{ github.run_number }}</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleSignature</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>????</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleVersion</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>1.0.0.${{ github.run_number }}</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>LSMinimumSystemVersion</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>10.13</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>NSHighResolutionCapable</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <true/>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <key>CFBundleIconFile</key>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '    <string>RagNext.icns</string>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '</dict>' >> Publish/RagNext_Intel.app/Contents/Info.plist
        echo '</plist>' >> Publish/RagNext_Intel.app/Contents/Info.plist

        # 6. Sign & Notarize Intel x64 App Bundle
        if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
          echo "Signing Intel x64 App Bundle..."
          find Publish/RagNext_Intel.app/Contents/MacOS -type f \( -name "*.dylib" -o -name "*.so" -o -name "RagNext" \) -exec codesign --force --verify --verbose --sign "Developer ID Application: RagNext Labs LLC (${{ secrets.APPLE_TEAM_ID }})" --options runtime {} +
          codesign --force --verify --verbose --sign "Developer ID Application: RagNext Labs LLC (${{ secrets.APPLE_TEAM_ID }})" --options runtime Publish/RagNext_Intel.app
          
          if [ -n "${{ secrets.APPLE_APP_PASSWORD }}" ]; then
            echo "Submitting Intel x64 App for Apple Notarization..."
            ditto -c -k --keepParent Publish/RagNext_Intel.app Publish/RagNext_Intel.zip
            xcrun notarytool submit Publish/RagNext_Intel.zip --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --wait
            xcrun stapler staple Publish/RagNext_Intel.app
            rm -f Publish/RagNext_Intel.zip
          fi
        fi

        # 7. Restore RagsCore back to multi-targeting
        sed -i '' 's/<TargetFramework>net9.0<\/TargetFramework>/<TargetFrameworks>net9.0;net9.0-android;net9.0-ios;net9.0-maccatalyst;net9.0-windows10.0.19041.0<\/TargetFrameworks>/' RagsCore/RagsCore.csproj

    - name: Compress macOS Intel x64 Distribution
      run: |
        cd Publish
        mv RagNext_Intel.app RagNext.app
        zip -r RagNext_Designer_Mac_Intel_x64.zip RagNext.app
        rm -rf RagNext.app

    - name: Upload macOS Intel x64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RagNext_Designer_Mac_Intel_x64
        path: Publish/RagNext_Designer_Mac_Intel_x64.zip
        retention-days: 14

  build-linux:
    name: Build Linux x64 Distribution
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buildLinux }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Configure NuGet Cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Retarget RagsCore to Net9.0 (Bypass Mobile Workloads)
      run: |
        sed -i 's/<TargetFrameworks>.*<\/TargetFrameworks>/<TargetFramework>net9.0<\/TargetFramework>/' RagsCore/RagsCore.csproj

    - name: Install Native AOT Prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev

    - name: Run Designer Unit Tests
      run: dotnet test RagNext.Tests/RagNext.Tests.csproj -c Release

    - name: Build & Publish Standalone Linux x64
      run: |
        # 1. Ensure RagsCore is targeted to net9.0 only
        sed -i 's/<TargetFrameworks>.*<\/TargetFrameworks>/<TargetFramework>net9.0<\/TargetFramework>/' RagsCore/RagsCore.csproj
        
        # 2. Run publish in Single-File ReadyToRun format
        rm -rf Publish/Designer-Linux
        dotnet publish RagNext.Designer.Avalonia/RagNext.Designer.Avalonia.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:Version="1.0.0-alpha.5.${{ github.run_number }}" -p:AssemblyVersion="1.0.0.${{ github.run_number }}" -p:FileVersion="1.0.0.${{ github.run_number }}" -o Publish/Designer-Linux
        
        # 3. Deploy WebAssets and Templates
        mkdir -p Publish/Designer-Linux/WebAssets
        cp -R RagNext.Designer.Avalonia/WebAssets/* Publish/Designer-Linux/WebAssets/
        if [ -d "Templates" ]; then
          mkdir -p Publish/Designer-Linux/Templates
          cp -R Templates/* Publish/Designer-Linux/Templates/
        fi

        # Ensure core executable has +x execution rights
        chmod +x Publish/Designer-Linux/RagNext

        # 4. Restore RagsCore back to multi-targeting
        sed -i 's/<TargetFramework>net9.0<\/TargetFramework>/<TargetFrameworks>net9.0;net9.0-android;net9.0-ios;net9.0-maccatalyst;net9.0-windows10.0.19041.0<\/TargetFrameworks>/' RagsCore/RagsCore.csproj

    - name: Compress Linux Distribution
      run: |
        cd Publish/Designer-Linux
        tar -czf ../RagNext_Designer_Linux_x64.tar.gz .

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RagNext_Designer_Linux_x64
        path: Publish/RagNext_Designer_Linux_x64.tar.gz
        retention-days: 14

