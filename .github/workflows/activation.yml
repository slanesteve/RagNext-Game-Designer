name: Get Unity Activation File (.alf)

on:
  workflow_dispatch: # Manually trigger from GitHub Actions

jobs:
  activation:
    name: Request Activation File (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Request the activation file from Unity
      - name: Request Activation File
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.6f1

      # Upload the .alf file so you can download it from the build summary
      - name: Upload .alf Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityActivationRequest
          path: ${{ steps.RequestActivationFile.outputs.filePath }}
