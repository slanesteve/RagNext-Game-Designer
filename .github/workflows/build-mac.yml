name: Build macOS Catalyst Player & Designer

on:
  workflow_dispatch: # Allows you to manually trigger this build from the GitHub Actions tab

jobs:
  build-mac:
    runs-on: macos-14 # Uses Apple Silicon M1/M2 virtual machines in the cloud
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer # Forces .NET MAUI to use Xcode 15.4 / SDK 17.5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4 (Mac Catalyst 17.5 SDK)
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Setup .NET 9.x SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Restore Player Dependencies
        run: dotnet restore RagsNextPlayer/RagsNextPlayer.csproj -p:EnableWindowsTargeting=true

      - name: Restore Designer Dependencies
        run: dotnet restore RagNext/RagsNextDesigner.csproj -p:EnableWindowsTargeting=true

      - name: Publish Mac Catalyst Player
        run: |
          dotnet publish RagsNextPlayer/RagsNextPlayer.csproj -c Release -f net9.0-maccatalyst -o ./Publish/PlayerTemplateMac -p:EnableWindowsTargeting=true

      - name: Publish Mac Catalyst Designer
        run: |
          dotnet publish RagNext/RagsNextDesigner.csproj -c Release -f net9.0-maccatalyst -o ./Publish/DesignerMac -p:EnableWindowsTargeting=true

      - name: Zip Mac Player (Preserves Unix Executable Permissions)
        run: |
          cd ./Publish/PlayerTemplateMac
          zip -r ../../RagsNextPlayer.app.zip RagsNextPlayer.app

      - name: Zip Mac Designer (Preserves Unix Executable Permissions)
        run: |
          cd ./Publish/DesignerMac
          zip -r ../../RagsNextDesigner.app.zip RagsNextDesigner.app

      - name: Upload Compiled Mac Player Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RagsNextPlayer-Mac-Catalyst
          path: RagsNextPlayer.app.zip
          if-no-files-found: error

      - name: Upload Compiled Mac Designer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RagsNextDesigner-Mac-Catalyst
          path: RagsNextDesigner.app.zip
          if-no-files-found: error
