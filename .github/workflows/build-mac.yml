name: Build macOS Catalyst Player & Designer

on:
  workflow_dispatch: # Allows you to manually trigger this build from the GitHub Actions tab

jobs:
  build-mac:
    runs-on: macos-14 # Uses Apple Silicon M1/M2 virtual machines in the cloud

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Select Active Xcode 16 (iOS 18 SDK)
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | tail -n 1)
          fi
          echo "Selected Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV

      - name: Setup .NET 9.x SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Restore Player Dependencies
        run: dotnet restore RagsNextPlayer/RagsNextPlayer.csproj -p:EnableWindowsTargeting=true -p:ValidateXcodeVersion=false

      - name: Restore Designer Dependencies
        run: dotnet restore RagNext/RagsNextDesigner.csproj -p:EnableWindowsTargeting=true -p:ValidateXcodeVersion=false

      - name: Publish Mac Catalyst Player
        run: |
          dotnet publish RagsNextPlayer/RagsNextPlayer.csproj -c Debug -f net9.0-maccatalyst -o ./Publish/PlayerTemplateMac -p:EnableWindowsTargeting=true -p:ValidateXcodeVersion=false -p:_SdkValidationSkip=true

      - name: Publish Mac Catalyst Designer
        run: |
          dotnet publish RagNext/RagsNextDesigner.csproj -c Debug -f net9.0-maccatalyst -o ./Publish/DesignerMac -p:EnableWindowsTargeting=true -p:ValidateXcodeVersion=false -p:_SdkValidationSkip=true

      - name: Zip Mac Player (Preserves Unix Executable Permissions)
        run: |
          cd ./Publish/PlayerTemplateMac
          zip -r ../../RagsNextPlayer.app.zip RagsNextPlayer.app

      - name: Zip Mac Designer (Preserves Unix Executable Permissions)
        run: |
          cd ./Publish/DesignerMac
          zip -r ../../RagsNextDesigner.app.zip RagsNextDesigner.app

      - name: Upload Compiled Mac Player Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RagsNextPlayer-Mac-Catalyst
          path: RagsNextPlayer.app.zip
          if-no-files-found: error

      - name: Upload Compiled Mac Designer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RagsNextDesigner-Mac-Catalyst
          path: RagsNextDesigner.app.zip
          if-no-files-found: error
